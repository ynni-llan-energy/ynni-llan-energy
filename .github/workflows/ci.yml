name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Unit tests — fast, no server needed
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run unit tests
        run: npm run test:ci

  # ---------------------------------------------------------------------------
  # Build + smoke tests — catch runtime 500s before Vercel deploys
  # ---------------------------------------------------------------------------
  smoke-tests:
    name: Build & smoke tests
    runs-on: ubuntu-latest
    env:
      # Public vars are embedded at build time — required for next build to succeed.
      # Add NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY as repository
      # secrets in GitHub (Settings → Secrets → Actions). Without them the app
      # still builds and smoke-tests public pages (auth is gracefully skipped).
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: production
      # Preview secret can be any stable string in CI
      NEXT_PUBLIC_SANITY_PREVIEW_SECRET: ci-smoke-test-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Start server and run smoke tests
        run: |
          # Start next start in the background
          npm start &
          SERVER_PID=$!

          # Wait up to 30 s for the server to be ready
          echo "Waiting for server on port 3000..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            sleep 1
          done

          # Run smoke tests
          BASE_URL=http://localhost:3000 npm run test:smoke:ci

          # Cleanly stop the background server
          kill $SERVER_PID 2>/dev/null || true

  # ---------------------------------------------------------------------------
  # E2E tests — full auth flows against local Supabase
  # ---------------------------------------------------------------------------
  e2e-tests:
    name: E2E tests (Playwright + local Supabase)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start
        # supabase start reads supabase/config.toml and runs migrations + seed

      - name: Extract Supabase credentials
        run: |
          # Use the CLI's structured `env` output rather than parsing the
          # human-oriented status table (which has changed shape more than
          # once). `-o env` gives stable KEY=VALUE lines from the CLI's own
          # field names.
          ENV_OUTPUT=$(supabase status -o env)
          echo "$ENV_OUTPUT" | grep -v 'KEY=' # log everything except key values

          SUPABASE_URL=$(echo "$ENV_OUTPUT" | grep -oP '^API_URL=\K.*' | tr -d '"')
          ANON_KEY=$(echo "$ENV_OUTPUT" | grep -oP '^ANON_KEY=\K.*' | tr -d '"')
          JWT_SECRET=$(echo "$ENV_OUTPUT" | grep -oP '^JWT_SECRET=\K.*' | tr -d '"')

          if [ -z "$SUPABASE_URL" ] || [ -z "$ANON_KEY" ] || [ -z "$JWT_SECRET" ]; then
            echo "ERROR: Could not extract Supabase credentials from 'supabase status -o env'"
            echo "$ENV_OUTPUT" | sed -E 's/(KEY=).*/\1<redacted>/'
            exit 1
          fi

          # Mint a service_role JWT ourselves rather than trust whichever key
          # format `supabase status` happens to expose this month — both the
          # colour-coded table's "Secret" column and the CLI's own (deprecated)
          # SERVICE_ROLE_KEY env field turned out to be the newer opaque
          # secret_key, which PostgREST does *not* grant table access to,
          # breaking any test/admin code that relies on RLS bypass. A JWT
          # signed with the project's own jwt_secret and `role: service_role`
          # is exactly what PostgREST has always validated for that bypass,
          # independent of whatever key-alias churn the CLI goes through.
          SERVICE_ROLE_KEY=$(JWT_SECRET="$JWT_SECRET" node -e "
            const crypto = require('crypto');
            const b64url = (input) => Buffer.from(input)
              .toString('base64')
              .replace(/\+/g, '-')
              .replace(/\//g, '_')
              .replace(/=+\$/, '');
            const now = Math.floor(Date.now() / 1000);
            const header = { alg: 'HS256', typ: 'JWT' };
            const payload = { role: 'service_role', iss: 'supabase-demo', iat: now, exp: now + 86400 };
            const data = b64url(JSON.stringify(header)) + '.' + b64url(JSON.stringify(payload));
            const sig = crypto.createHmac('sha256', process.env.JWT_SECRET).update(data).digest('base64')
              .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+\$/, '');
            console.log(data + '.' + sig);
          ")

          echo "Extracted URL: $SUPABASE_URL"
          echo "Extracted anon key prefix: ${ANON_KEY:0:20}..."

          echo "SUPABASE_URL=$SUPABASE_URL" >> $GITHUB_ENV
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> $GITHUB_ENV
          # These env vars are also needed for the Next.js build
          echo "NEXT_PUBLIC_SUPABASE_URL=$SUPABASE_URL" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> $GITHUB_ENV
          echo "SITE_URL=http://localhost:3000" >> $GITHUB_ENV

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_PREVIEW_SECRET: ci-e2e-secret

      - name: Start server and run E2E tests
        run: |
          # Start the production server in the background
          npm start &
          SERVER_PID=$!

          # Wait up to 30 s for the server to be ready
          echo "Waiting for server on port 3000..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            sleep 1
          done

          # Run Playwright tests (CI env var disables webServer in playwright.config.ts)
          BASE_URL=http://localhost:3000 npm run test:e2e:ci

          # Cleanly stop the background server
          kill $SERVER_PID 2>/dev/null || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # test:e2e:ci runs with --reporter=github (for inline annotations),
          # which overrides playwright.config.ts's reporter list and never
          # writes playwright-report/. Failure screenshots/traces land in
          # test-results/ instead — upload that so failures are debuggable.
          path: test-results/
          retention-days: 14
