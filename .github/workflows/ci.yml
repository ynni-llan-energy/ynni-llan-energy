name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Unit tests — fast, no server needed
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run unit tests
        run: npm run test:ci

  # ---------------------------------------------------------------------------
  # Build + smoke tests — catch runtime 500s before deploying
  # ---------------------------------------------------------------------------
  smoke-tests:
    name: Build & smoke tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ynni_llan
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ynni_llan_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Marketing pages statically prerender at build time and render the
      # site header, which reads the session via Auth.js — so a reachable
      # Postgres and AUTH_SECRET are required for `next build` to succeed,
      # not just for runtime.
      DATABASE_URL: postgres://ynni_llan:ci_password@localhost:5432/ynni_llan_ci
      AUTH_SECRET: ci-smoke-test-secret-not-for-production
      AUTH_URL: http://localhost:3000
      RESEND_API_KEY: re_ci_placeholder_not_used
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: production
      # Preview secret can be any stable string in CI
      NEXT_PUBLIC_SANITY_PREVIEW_SECRET: ci-smoke-test-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run database migrations
        run: npx drizzle-kit migrate

      - name: Build
        run: npm run build

      - name: Start server and run smoke tests
        run: |
          # Start next start in the background
          npm start &
          SERVER_PID=$!

          # Wait up to 30 s for the server to be ready
          echo "Waiting for server on port 3000..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            sleep 1
          done

          # Run smoke tests
          BASE_URL=http://localhost:3000 npm run test:smoke:ci

          # Cleanly stop the background server
          kill $SERVER_PID 2>/dev/null || true

  # ---------------------------------------------------------------------------
  # E2E tests — full auth flows against local Postgres
  # ---------------------------------------------------------------------------
  e2e-tests:
    name: E2E tests (Playwright + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ynni_llan
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ynni_llan_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://ynni_llan:ci_password@localhost:5432/ynni_llan_ci
      AUTH_SECRET: ci-e2e-test-secret-not-for-production
      AUTH_URL: http://localhost:3000
      SITE_URL: http://localhost:3000
      RESEND_API_KEY: re_ci_placeholder_not_used
      # tests/helpers/auth.ts (imported by tests/fixtures.ts) runs directly
      # against Postgres via Drizzle, and needs AUTH_SECRET to construct a
      # verification-token hash matching what the running server computes.
      BASE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run database migrations
        run: npx drizzle-kit migrate

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_PREVIEW_SECRET: ci-e2e-secret

      - name: Start server and run E2E tests
        run: |
          # Start the production server in the background
          npm start &
          SERVER_PID=$!

          # Wait up to 30 s for the server to be ready
          echo "Waiting for server on port 3000..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            sleep 1
          done

          # Run Playwright tests (CI env var disables webServer in playwright.config.ts)
          npm run test:e2e:ci

          # Cleanly stop the background server
          kill $SERVER_PID 2>/dev/null || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # test:e2e:ci runs with --reporter=github (for inline annotations),
          # which overrides playwright.config.ts's reporter list and never
          # writes playwright-report/. Failure screenshots/traces land in
          # test-results/ instead — upload that so failures are debuggable.
          path: test-results/
          retention-days: 14
