# Production deploy for the Hetzner box. Not used for local dev — see
# docker-compose.dev.yml for that.
#
# All ports except Caddy's 80/443 are bound to 127.0.0.1 only: Docker
# publishes ports via iptables rules that bypass ufw entirely, so a plain
# `ports: ["5432:5432"]` would expose Postgres to the whole internet
# regardless of any firewall configured on the host. Binding to 127.0.0.1
# keeps them reachable for on-box debugging (SSH in, curl/psql localhost)
# without that exposure.
#
# Migrations run as a one-off, not implicitly on `web` startup — see the
# `migrate` service below and .github/workflows/deploy.yml.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-off: `docker compose run --rm migrate`. Never started by `up -d`.
  migrate:
    image: ${MIGRATE_IMAGE}
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  web:
    image: ${WEB_IMAGE}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      SITE_URL: ${SITE_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_ADDRESS: ${RESEND_FROM_ADDRESS}
      CRON_SECRET: ${CRON_SECRET}
      SANITY_API_TOKEN: ${SANITY_API_TOKEN}
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${NEXT_PUBLIC_SANITY_PROJECT_ID}
      NEXT_PUBLIC_SANITY_DATASET: ${NEXT_PUBLIC_SANITY_DATASET}
      NEXT_PUBLIC_SANITY_PREVIEW_SECRET: ${NEXT_PUBLIC_SANITY_PREVIEW_SECRET}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
